name: Build TV APK & Cloudstream Repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv-apk:
    name: Build Standalone Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build TV Release APK (Signed)
        working-directory: ./tv-app
        run: gradle assembleRelease --no-daemon

      - name: Build Phone Release APK (Signed)
        working-directory: ./phone-app
        run: gradle assembleRelease --no-daemon

      - name: Rename TV & Phone APKs with Version Number
        id: meta
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' tv-app/app/build.gradle.kts)
          APK_VERSIONED="citeraloka${VERSION_NAME}.apk"
          PHONE_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' phone-app/app/build.gradle.kts)
          PHONE_APK_VERSIONED="citeraloka-phone${PHONE_VERSION}.apk"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_versioned=${APK_VERSIONED}" >> "$GITHUB_OUTPUT"
          echo "phone_version=${PHONE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "phone_apk_versioned=${PHONE_APK_VERSIONED}" >> "$GITHUB_OUTPUT"
          cp tv-app/app/build/outputs/apk/release/app-release.apk "${APK_VERSIONED}"
          cp tv-app/app/build/outputs/apk/release/app-release.apk CiteraLoka.apk
          cp phone-app/app/build/outputs/apk/release/app-release.apk "${PHONE_APK_VERSIONED}"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: citeraloka-tv-and-phone
          path: |
            ${{ steps.meta.outputs.apk_versioned }}
            ${{ steps.meta.outputs.phone_apk_versioned }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CiteraLoka TV v${{ steps.meta.outputs.version_name }} & Phone v${{ steps.meta.outputs.phone_version }}"
          body: |
            ### 📺 Edisi Android TV / Google TV / Mi Box (`${{ steps.meta.outputs.apk_versioned }}`)
            - **URL Muat Turun TV:** `https://github.com/${{ github.repository }}/releases/download/latest/${{ steps.meta.outputs.apk_versioned }}`

            ### 📱 Edisi Telefon Pintar Portrait Gaya Netflix Mobile (`${{ steps.meta.outputs.phone_apk_versioned }}`)
            - **URL Muat Turun Phone:** `https://github.com/${{ github.repository }}/releases/download/latest/${{ steps.meta.outputs.phone_apk_versioned }}`

            ### ☁️ Pemasangan Melalui Cloudstream Repository (Plugin JSON)
            - **URL Cloudstream Repo:** `https://raw.githubusercontent.com/${{ github.repository }}/builds/repo.json`
          files: |
            ${{ steps.meta.outputs.apk_versioned }}
            ${{ steps.meta.outputs.phone_apk_versioned }}
            CiteraLoka.apk
          prerelease: false

  build-cloudstream-repo:
    name: Build Cloudstream Plugin & JSON Repo
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Cloudstream Plugin (.cs3) & plugins.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle make makePluginsJson --no-daemon
          mkdir -p dist
          cp LK21Provider/build/LK21Provider.cs3 dist/ || true
          cp build/plugins.json dist/ || true
          cat <<EOF > dist/repo.json
          {
            "name": "LK21 TV Official Cloudstream Repo",
            "description": "Repository Cloudstream untuk LK21 / NontonDrama TV Series & Movies (Bebas Iklan)",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"
            ]
          }
          EOF

      - name: Deploy to 'builds' branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./dist
          force_orphan: true
