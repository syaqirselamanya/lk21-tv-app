name: Build TV APK & Cloudstream Repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv-apk:
    name: Build Standalone Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK (Signed)
        working-directory: ./tv-app
        run: gradle assembleRelease --no-daemon

      - name: Rename APK for Easy TV Download
        run: |
          cp tv-app/app/build/outputs/apk/release/app-release.apk LK21-TV-NoAds.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LK21-TV-NoAds-APK
          path: LK21-TV-NoAds.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LK21 TV App (Bebas Iklan) - Latest Build"
          body: |
            ### 📺 Pemasangan Aplikasi Android TV (Standalone APK)
            Muat turun fail **`LK21-TV-NoAds.apk`** di bawah terus ke Android TV / Google TV / Mi Box anda menggunakan aplikasi **Downloader**:
            - **URL Muat Turun Terus:** `https://github.com/${{ github.repository }}/releases/download/latest/LK21-TV-NoAds.apk`

            ### ☁️ Pemasangan Melalui Cloudstream Repository (Plugin JSON)
            Masukkan URL Repository ini di dalam aplikasi **Cloudstream** pada TV anda:
            - **URL Cloudstream Repo:** `https://raw.githubusercontent.com/${{ github.repository }}/builds/repo.json`
          files: |
            LK21-TV-NoAds.apk
          prerelease: false

  build-cloudstream-repo:
    name: Build Cloudstream Plugin & JSON Repo
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Cloudstream Plugin (.cs3) & plugins.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle make makePluginsJson --no-daemon
          mkdir -p dist
          cp LK21Provider/build/LK21Provider.cs3 dist/ || true
          cp build/plugins.json dist/ || true
          cat <<EOF > dist/repo.json
          {
            "name": "LK21 TV Official Cloudstream Repo",
            "description": "Repository Cloudstream untuk LK21 / NontonDrama TV Series & Movies (Bebas Iklan)",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"
            ]
          }
          EOF

      - name: Deploy to 'builds' branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./dist
          force_orphan: true
